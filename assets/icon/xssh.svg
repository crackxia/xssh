<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- xssh app icon: an "x" at a shell prompt with a lit cursor ("x_"). The two strokes weave. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22306A"/>
      <stop offset="0.5" stop-color="#121B3D"/>
      <stop offset="1" stop-color="#090E22"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.26" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="strokeA" gradientUnits="userSpaceOnUse" x1="250" y1="348" x2="554" y2="652">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="strokeB" gradientUnits="userSpaceOnUse" x1="554" y1="348" x2="250" y2="652">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <!-- Cuts a gap into stroke A where stroke B passes over it. -->
    <mask id="weave" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <path d="M 459 443 L 345 557" stroke="#000000" stroke-width="124" stroke-linecap="butt"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-150%" width="220%" height="400%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#sheen)"/>
  <rect x="34" y="34" width="956" height="956" rx="214" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g clip-path="url(#tile)" transform="translate(0 12)">
    <g filter="url(#shadow)">
      <path d="M 250 348 L 554 652" stroke="url(#strokeA)" stroke-width="96" stroke-linecap="round" mask="url(#weave)"/>
      <path d="M 554 348 L 250 652" stroke="url(#strokeB)" stroke-width="96" stroke-linecap="round"/>
    </g>
    <rect x="644" y="628" width="176" height="72" rx="22" fill="#2DD4BF" opacity="0.55" filter="url(#glow)"/>
    <rect x="644" y="628" width="176" height="72" rx="22" fill="url(#cursor)"/>
  </g>
</svg>
