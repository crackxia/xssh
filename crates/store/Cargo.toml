[package]
name = "xssh-store"
description = "xssh local state: hosts, config, secrets (OS keyring / encrypted file), audit log, job records."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
xssh-core.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
humantime.workspace = true
argon2 = "0.6"
hex.workspace = true
keyring.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Environment", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
