[package]
name = "xssh-desktop"
description = "xssh desktop manager: hosts, sessions, forwards, jobs, audit and daemon control."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "xssh-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
xssh-core.workspace = true
xssh-store.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
