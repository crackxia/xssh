[package]
name = "xssh"
description = "SSH client designed for AI agents: managed hosts & secrets, persistent sessions, interactive PTY automation, structured output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "xssh"
path = "src/main.rs"

[dependencies]
xssh-core.workspace = true
xssh-store.workspace = true
xssh-engine.workspace = true
base64.workspace = true
clap.workspace = true
encoding_rs.workspace = true
regex.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
