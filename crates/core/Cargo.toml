[package]
name = "xssh-core"
description = "xssh shared layer: error type, home layout, daemon protocol and IPC, text helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# `From` conversions for russh / russh-sftp errors (used by the engine).
ssh = ["dep:russh", "dep:russh-sftp"]

[dependencies]
chrono.workspace = true
encoding_rs.workspace = true
hex.workspace = true
humantime.workspace = true
interprocess.workspace = true
rand.workspace = true
regex.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strip-ansi-escapes.workspace = true
tokio.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization"] }
